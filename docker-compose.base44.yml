services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview.localhost}
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install --legacy-peer-deps && npx vite --host 0.0.0.0 --port 8080"
    restart: unless-stopped

volumes:
  node_modules:
